<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Guide Registration</title>
    <link rel="stylesheet" href="css/localguide.css">
</head>

<body>
    <!-- Guide Registration Form -->
    <div class="container">
        <h1>Become a Local Guide</h1>
        <form id="guideForm">

            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" required>
            </div>

            <div class="form-group">
                <label for="expertise">Expertise</label>
                <input type="text" id="expertise" name="expertise" required>
            </div>

            <div class="form-group">
                <label for="location">Location Known</label>
                <input type="text" id="location" name="location" required>
            </div>

            <div class="form-group">
                <label for="languages">Languages Known</label>
                <input type="text" id="languages" name="languages" placeholder="e.g., English, French" required>
            </div>

            <div class="form-group">
                <label for="profile">Profile Description</label>
                <textarea id="profile" name="profile" required></textarea>
            </div>

            <div class="form-group">
                <label for="contact">Contact Number</label>
                <input type="tel" id="contact" name="contact" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="availability">Availability</label>
                <input type="text" id="availability" name="availability" required>
            </div>

            <div class="form-group">
                <button type="submit">Register</button>
            </div>
        </form>
    </div>
</body>

</html>
